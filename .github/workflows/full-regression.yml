name: Full Regression Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Full Web acceptance chain
        env:
          ALLOW_SQLITE_PRODUCTION_TEST: "1"
          COMMAND_CONTEXT_SECRET: ci-acceptance-command-secret
          PAYMENT_WEBHOOK_SECRET: ci-acceptance-webhook-secret
        run: node scripts/acceptance-web-full.mjs
      - name: Upload Web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-web-evidence
          path: artifacts/web-acceptance-evidence.json
          if-no-files-found: warn

  android-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew
      - name: Android unit and APK acceptance build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: full-regression-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-acceptance:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: XCTest acceptance
        working-directory: ios
        run: swift test
      - name: iOS package acceptance build
        working-directory: ios
        run: xcodebuild -scheme AiDigitalSinai-Package -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

  completed:
    if: always()
    needs: [web-acceptance, android-acceptance, ios-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform gate to pass
        run: |
          test "${{ needs.web-acceptance.result }}" = success
          test "${{ needs.android-acceptance.result }}" = success
          test "${{ needs.ios-acceptance.result }}" = success
          echo "COMPLETED: Web + Android + iOS acceptance gates passed."
