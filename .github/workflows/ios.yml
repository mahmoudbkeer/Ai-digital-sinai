name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run XCTest
        working-directory: ios
        run: swift test
      - name: Build iOS package
        working-directory: ios
        run: xcodebuild -scheme AiDigitalSinai-Package -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
