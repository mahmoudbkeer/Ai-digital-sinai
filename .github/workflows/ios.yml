name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run XCTest
        working-directory: ios
        run: swift test
      - name: Build iOS package
        working-directory: ios
        run: xcodebuild -scheme AiDigitalSinai-Package -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      - name: Attempt Simulator screenshot
        id: simulator_screenshot
        working-directory: ios
        run: |
          mkdir -p ../artifacts
          limitation="../artifacts/ios-marketplace-screenshot-limitation.txt"
          DEVICE=$(xcrun simctl list devices available | sed -nE 's/.*\(([A-F0-9-]{36})\) \(.*//p' | head -1)
          if [ -z "$DEVICE" ]; then
            echo "Simulator screenshot unavailable: no available iOS Simulator device." > "$limitation"
            exit 0
          fi
          if ! (
            xcrun simctl boot "$DEVICE" 2>/dev/null || true
            xcrun simctl bootstatus "$DEVICE" -b
            xcodebuild -scheme AiDigitalSinaiApp -destination "platform=iOS Simulator,id=$DEVICE" build CODE_SIGNING_ALLOWED=NO -derivedDataPath /tmp/AiDigitalSinaiDerived
            APP=$(find /tmp/AiDigitalSinaiDerived/Build/Products -name 'AiDigitalSinaiApp.app' -type d -print -quit)
            test -n "$APP"
            BUNDLE_ID=$( /usr/libexec/PlistBuddy -c 'Print:CFBundleIdentifier' "$APP/Info.plist" 2>/dev/null || echo "AiDigitalSinaiApp" )
            xcrun simctl install "$DEVICE" "$APP"
            xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot ../artifacts/ios-marketplace-simulator.png
          ); then
            echo "Simulator screenshot unavailable: iOS executable package could not be built/installed/launched on this runner." > "$limitation"
          fi
          exit 0
      - name: Upload Simulator screenshot or limitation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-marketplace-screenshot-attempt
          path: |
            artifacts/ios-marketplace-simulator.png
            artifacts/ios-marketplace-screenshot-limitation.txt
          if-no-files-found: warn
