name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Secret filename and content scan
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o -path './node_modules' -prune -o -type f \( -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo 'Environment files must not be committed.'
            exit 1
          fi
          if git grep -nI -E 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|sk_live_[A-Za-z0-9]+' -- .; then
            echo 'Potential secret pattern detected.'
            exit 1
          fi

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          ALLOW_SQLITE_PRODUCTION_TEST=1 COMMAND_CONTEXT_SECRET=ci-command-secret PAYMENT_WEBHOOK_SECRET=ci-webhook-secret pnpm start > /tmp/ai-digital-sinai-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ai-digital-sinai-server.log
          exit 1

      - name: Browser end-to-end test
        run: pnpm test:e2e

      - name: Smoke test
        run: pnpm test:smoke

      - name: Load smoke test
        run: LOAD_CONCURRENCY=10 LOAD_REQUESTS=10 pnpm test:load
