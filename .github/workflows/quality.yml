name: Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and start PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          ALTER USER postgres WITH PASSWORD 'postgres';
          SELECT 'CREATE DATABASE ai_digital_sinai'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ai_digital_sinai')\gexec
          SQL
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -U postgres -d ai_digital_sinai; then
              exit 0
            fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -U postgres -d ai_digital_sinai

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm audit --prod --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Dependency audit request failed; retrying in ${delay}s (attempt $((attempt + 1))/3)."
              sleep "$delay"
            fi
          done
          echo 'Dependency audit failed after 3 attempts.'
          exit 1

      - name: Secret filename and content scan
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o -path './node_modules' -prune -o -type f \( -name '.env' -o -name '.env.*' \) ! -name '*.example' ! -name '*.sample' ! -name '*.template' -print -quit | grep -q .; then
            echo 'Environment files must not be committed.'
            exit 1
          fi
          if git grep -nI -E 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|sk_live_[A-Za-z0-9]+' -- .; then
            echo 'Potential secret pattern detected.'
            exit 1
          fi

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Kashier payment contract and mock webhook tests
        run: pnpm exec vitest run server/payment.test.ts server/paymentProviders.test.ts server/paymentEndpoint.test.ts

      - name: Notification provider and managed infrastructure contracts
        run: pnpm exec vitest run server/notificationProviders.test.ts server/integrations.test.ts

      - name: Production build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          ALLOW_SQLITE_PRODUCTION_TEST=1 COMMAND_CONTEXT_SECRET=ci-command-secret PAYMENT_WEBHOOK_SECRET=ci-webhook-secret CORS_ORIGINS=http://localhost:3000 pnpm start > /tmp/ai-digital-sinai-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ai-digital-sinai-server.log
          exit 1

      - name: Browser end-to-end test
        run: pnpm test:e2e

      - name: Smoke test
        run: pnpm test:smoke

      - name: Load smoke test
        run: LOAD_CONCURRENCY=25 LOAD_REQUESTS=30 pnpm test:load

      - name: Application security smoke test
        run: BASE_URL=http://127.0.0.1:3000 pnpm test:security

      - name: Adversarial security integration test
        run: pnpm test:security:adversarial

      - name: PostgreSQL migration and schema verification
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_digital_sinai
          DATABASE_ENGINE: postgresql
          POSTGRESQL_TEST_MODE: "true"
          NODE_ENV: staging
          COMMAND_CONTEXT_SECRET: ci-postgres-command-secret
          PAYMENT_WEBHOOK_SECRET: ci-postgres-webhook-secret
        run: pnpm test:staging

      - name: PostgreSQL critical tenant and financial integrity test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_digital_sinai
          DATABASE_ENGINE: postgresql
          POSTGRESQL_TEST_MODE: "true"
          NODE_ENV: staging
          COMMAND_CONTEXT_SECRET: ci-postgres-command-secret
          PAYMENT_WEBHOOK_SECRET: ci-postgres-webhook-secret
        run: pnpm test:staging:api
